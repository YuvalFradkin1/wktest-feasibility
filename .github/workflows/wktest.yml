name: WKWebView Feasibility

on:
  workflow_dispatch:

jobs:
  wktest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Provenance
        run: uname -m && sw_vers && xcodebuild -version

      - name: Build and Run
        run: |
          cd WKTest
          swift build -c release 2>&1
          BIN_DIR=$(swift build -c release --show-bin-path)
          BIN="$BIN_DIR/WKTest"
          echo "BIN: $BIN"
          ls -la "$BIN"
          codesign --force --deep --sign - "$BIN" 2>&1 || true

          echo "=== Running WKTest ==="
          set +e
          # macOS uses gtimeout (coreutils) or perl fallback
          if command -v gtimeout &>/dev/null; then
            gtimeout 35 "$BIN" 2>&1
          else
            perl -e 'alarm 35; exec @ARGV' "$BIN" 2>&1
          fi
          EXIT=$?
          set -e

          echo "exit=$EXIT"
          if [ $EXIT -eq 0 ]; then
            echo "RESULT=PASS"
          elif [ $EXIT -eq 142 ]; then
            echo "RESULT=TIMEOUT"
          else
            echo "RESULT=FAIL_$EXIT"
          fi

      - name: Summary
        if: always()
        run: echo "OS=$(sw_vers -productVersion) arch=$(uname -m)"
