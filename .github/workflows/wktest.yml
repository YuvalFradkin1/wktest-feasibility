name: WKWebView Phase B — WebRTC Hostname Crash

on:
  workflow_dispatch:

jobs:
  phase-b:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Provenance
        run: |
          uname -m && sw_vers && xcodebuild -version
          defaults read /System/Library/Frameworks/WebKit.framework/Versions/A/Resources/Info.plist CFBundleVersion 2>/dev/null || true

      - name: Build
        run: |
          cd WKTest
          swift build -c release 2>&1
          BIN_DIR=$(swift build -c release --show-bin-path)
          echo "BIN=$BIN_DIR/WKTest" >> $GITHUB_ENV
          ls -la "$BIN_DIR/WKTest"

      - name: Sign
        run: codesign --force --deep --sign - "$BIN" 2>&1 || true

      - name: Phase B — Control + Exploit
        run: |
          echo "Signal: 4a2069dce8 — WebRTC overlong hostname"
          set +e
          perl -e 'alarm 90; exec @ARGV' "$BIN" 2>&1
          EXIT=$?
          set -e
          echo "exit=$EXIT"
          echo "phase_b_exit=$EXIT" >> $GITHUB_ENV
          CRASH_DIR="$HOME/Library/Logs/DiagnosticReports"
          echo "--- Crash logs ---"
          ls "$CRASH_DIR"/ 2>/dev/null && \
            for f in "$CRASH_DIR"/*.crash "$CRASH_DIR"/*.ips; do
              [ -f "$f" ] && echo "=== $f ===" && head -80 "$f"
            done || echo "no crash logs"
          if [ $EXIT -eq 139 ]; then echo "RESULT=SIGSEGV"
          elif [ $EXIT -eq 134 ]; then echo "RESULT=SIGABRT"
          elif [ $EXIT -eq 0 ]; then echo "RESULT=COMPLETED_exit0"
          else echo "RESULT=EXIT_$EXIT"; fi >> $GITHUB_ENV

      - name: Summary
        if: always()
        run: |
          echo "OS=$(sw_vers -productVersion) arch=$(uname -m)"
          echo "exit=$phase_b_exit RESULT=$RESULT"
