name: WKWebView Phase B retry — AcceleratedEffect Race

on:
  workflow_dispatch:

jobs:
  phase-b:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Provenance
        run: |
          uname -m && sw_vers
          defaults read /System/Library/Frameworks/WebKit.framework/Versions/A/Resources/Info.plist CFBundleVersion 2>/dev/null || true

      - name: Build
        run: |
          cd WKTest
          swift build -c release 2>&1
          BIN_DIR=$(swift build -c release --show-bin-path)
          echo "BIN=$BIN_DIR/WKTest" >> $GITHUB_ENV
          ls -la "$BIN_DIR/WKTest"

      - name: Sign
        run: codesign --force --deep --sign - "$BIN" 2>&1 || true

      - name: Phase B — 3x WKWebView, 25 iterations
        run: |
          echo "Signal: 7224709bf0 — AcceleratedEffect polygon cache race"
          echo "Config: 3 WKWebViews, 25 iterations, 3 passes required"
          set +e
          perl -e 'alarm 2700; exec @ARGV' "$BIN" 2>&1
          EXIT=$?
          set -e
          echo "exit=$EXIT" >> $GITHUB_ENV
          if [ $EXIT -eq 139 ]; then
            echo "RESULT=SIGSEGV" >> $GITHUB_ENV
            echo "*** SIGSEGV ***"
          elif [ $EXIT -eq 134 ]; then
            echo "RESULT=SIGABRT" >> $GITHUB_ENV
            echo "*** SIGABRT ***"
          elif [ $EXIT -eq 0 ]; then
            echo "RESULT=INCONCLUSIVE" >> $GITHUB_ENV
          else
            echo "RESULT=EXIT_$EXIT" >> $GITHUB_ENV
          fi
          CRASH_DIR="$HOME/Library/Logs/DiagnosticReports"
          ls "$CRASH_DIR"/*.crash "$CRASH_DIR"/*.ips 2>/dev/null && \
            for f in "$CRASH_DIR"/*.crash "$CRASH_DIR"/*.ips; do
              [ -f "$f" ] && echo "=== CRASH: $f ===" && head -80 "$f"
            done || echo "no crash logs"

      - name: Summary
        if: always()
        run: |
          echo "OS=$(sw_vers -productVersion) arch=$(uname -m)"
          echo "exit=$exit RESULT=$RESULT"
          [[ "$RESULT" == SIGSEGV || "$RESULT" == SIGABRT ]] && \
            echo "Phase B: PASS" || echo "Phase B: $RESULT"
