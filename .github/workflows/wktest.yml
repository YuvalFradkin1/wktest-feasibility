name: WKWebView Phase B — anchor position-visibility crash

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  phase-b:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Provenance
        run: |
          uname -m && sw_vers
          defaults read /System/Library/Frameworks/WebKit.framework/Versions/A/Resources/Info.plist CFBundleVersion 2>/dev/null || true

      - name: Build
        run: |
          cd WKTest
          swift build -c release 2>&1 | tail -5
          BIN_DIR=$(swift build -c release --show-bin-path)
          echo "BIN=$BIN_DIR/WKTest" >> $GITHUB_ENV

      - name: Sign
        run: codesign --force --deep --sign - "$BIN" 2>&1 || true

      - name: Phase B — anchor position-visibility + br anchor
        run: |
          echo "Signal: 4847c476a8 — anchor crash on br"
          set +e
          perl -e 'alarm 60; exec @ARGV' "$BIN" 2>&1
          EXIT=$?
          set -e
          echo "exit=$EXIT" >> $GITHUB_ENV
          [ $EXIT -eq 134 ] && echo "RESULT=SIGABRT" >> $GITHUB_ENV && echo "*** SIGABRT ***" || true
          [ $EXIT -eq 139 ] && echo "RESULT=SIGSEGV" >> $GITHUB_ENV && echo "*** SIGSEGV ***" || true
          [ $EXIT -eq 0 ]   && echo "RESULT=INCONCLUSIVE" >> $GITHUB_ENV || true
          [ -z "$RESULT" ]  && echo "RESULT=EXIT_$EXIT" >> $GITHUB_ENV || true
          CRASH_DIR="$HOME/Library/Logs/DiagnosticReports"
          find "$CRASH_DIR" -name "*.crash" -o -name "*.ips" 2>/dev/null | \
            while read f; do echo "=== $f ==="; head -40 "$f"; done || echo "no crash logs"

      - name: Summary
        if: always()
        run: |
          echo "OS=$(sw_vers -productVersion) arch=$(uname -m)"
          echo "exit=$exit RESULT=$RESULT"
          [[ "$RESULT" == SIGABRT || "$RESULT" == SIGSEGV ]] && echo "Phase B: PASS" || echo "Phase B: $RESULT"
